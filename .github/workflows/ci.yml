name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test ci/Core.Tests.csproj
  # Compile-only against the real engine; needs a Unity licence secret, so it is skipped without one.
  unity-compile:
    runs-on: ubuntu-latest
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
    steps:
      - uses: actions/checkout@v4
        if: env.UNITY_LICENSE != ''
      - uses: game-ci/unity-test-runner@v4
        if: env.UNITY_LICENSE != ''
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          packageMode: true
          projectPath: .
          unityVersion: 2022.3.45f1
          testMode: editmode
